<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Z Imobiliária — Imóveis selicionados no Grande Porto. Compre e venda com eficácia.">
<meta name="keywords" content="imóveis luxo, apartamentos premium, moradias exclusivas, imobiliária Portugal">
<title>Z — Imobiliária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --white: #FFFFFF;
  --black: #0A0A0A;
  --gray-50: #F8F8F6;
  --gray-100: #F0EFE9;
  --gray-200: #E2E0D8;
  --gray-300: #C8C6BC;
  --gray-400: #9E9C94;
  --gray-500: #6E6C64;
  --gray-700: #3A3834;
  --gray-900: #1A1916;
  --gold: #B8935A;
  --gold-light: #D4AF7A;
  --gold-dark: #8B6B3A;
  --gold-pale: #F5EDD8;
  --nav-h: 90px;
  --transition: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
[data-theme="dark"] {
  --white: #0A0A0A;
  --black: #F5F4F0;
  --gray-50: #111110;
  --gray-100: #1A1916;
  --gray-200: #242320;
  --gray-300: #3A3834;
  --gray-400: #6E6C64;
  --gray-500: #9E9C94;
  --gray-700: #C8C6BC;
  --gray-900: #E8E6DC;
  --gold-pale: #1E1A10;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--white);
  color: var(--black);
  overflow-x: hidden;
  transition: background 0.4s, color 0.4s;
}
/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--gray-100); }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6vw;
  transition: background 0.5s var(--transition), backdrop-filter 0.5s;
}
nav.scrolled {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--gray-200);
  box-shadow: 0 4px 40px rgba(0,0,0,0.04);
}
[data-theme="dark"] nav.scrolled {
  background: rgba(10,10,10,0.92);
}
.nav-logo {
  text-decoration: none;
  display: flex;
  align-items: center;
  opacity: 1;
  transition: opacity 0.3s;
}
.nav-logo:hover { opacity: 0.85; }
nav.scrolled .nav-logo { opacity: 1; }
.nav-links {
  display: flex; align-items: center; gap: 2.5rem; list-style: none;
}
.nav-links a {
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  transition: color 0.3s;
  font-weight: 400;
}
nav.scrolled .nav-links a { color: var(--gray-500); }
nav.scrolled .nav-links a:hover, .nav-links a:hover { color: var(--gold); }
.nav-cta {
  padding: 10px 24px;
  border: 1px solid rgba(255,255,255,0.5);
  color: var(--white) !important;
  border-radius: 2px;
  font-size: 0.75rem !important;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-decoration: none;
  transition: all 0.3s !important;
  white-space: nowrap;
}
nav.scrolled .nav-cta {
  border-color: var(--gold);
  color: var(--gold) !important;
}
.nav-cta:hover { background: var(--gold) !important; border-color: var(--gold) !important; color: var(--white) !important; }
.nav-right { display: flex; align-items: center; gap: 1.5rem; }
.theme-toggle {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.7); font-size: 1.1rem; line-height: 1;
  transition: color 0.3s; padding: 4px;
}
nav.scrolled .theme-toggle { color: var(--gray-500); }
.theme-toggle:hover { color: var(--gold); }
.hamburger { display: none; background: none; border: none; cursor: pointer; flex-direction: column; gap: 5px; padding: 4px; }
.hamburger span { display: block; width: 22px; height: 1.5px; background: var(--white); transition: all 0.3s; }
nav.scrolled .hamburger span { background: var(--black); }

/* HERO */
.hero {
  position: relative; height: 100vh; min-height: 700px;
  display: flex; align-items: flex-end; justify-content: flex-start;
  overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #1A1916 0%, #2C2A24 40%, #0A0A08 100%);
}
.hero-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
  z-index: 1;
}
.hero-visual {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: 1fr 1fr;
}
.hero-img-block {
  position: relative; overflow: hidden;
}
.hero-img-block::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(0,0,0,0.15);
}
.hero-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.hero-placeholder.a { background: linear-gradient(145deg, #2D2920 0%, #1E1B14 50%, #3C3428 100%); }
.hero-placeholder.b { background: linear-gradient(145deg, #1A1916 0%, #2A2520 50%, #161410 100%); }
.hp-inner {
  display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: 0.15;
}
.hp-inner svg { width: 80px; height: 80px; }
.hero-content {
  position: relative; z-index: 2;
  padding: 0 6vw 12vh;
  max-width: 780px;
  margin-top: auto;
}
.hero-eyebrow {
  font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 2rem;
  display: flex; align-items: center; gap: 14px;
}
.hero-eyebrow::before {
  content: ''; width: 32px; height: 1px; background: var(--gold);
}
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 6.5vw, 6.5rem);
  font-weight: 300;
  line-height: 1.04;
  color: var(--white);
  margin-bottom: 2rem;
  letter-spacing: -0.01em;
}
.hero-title em { font-style: italic; color: var(--gold-light); }
.hero-subtitle {
  font-size: 1rem;
  font-weight: 300;
  color: rgba(255,255,255,0.7);
  line-height: 1.8;
  margin-bottom: 3.5rem;
  max-width: 500px;
}
.hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }
.btn-primary {
  padding: 16px 36px;
  background: var(--gold);
  color: var(--white);
  border: none; border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.35s var(--transition);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 10px;
}
.btn-primary:hover { background: var(--gold-dark); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(184,147,90,0.35); }
.btn-outline {
  padding: 16px 36px;
  background: transparent;
  color: var(--white);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.35s var(--transition);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 10px;
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); background: rgba(184,147,90,0.07); }
.hero-scroll {
  position: absolute; bottom: 44px; right: 6vw; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: rgba(255,255,255,0.5); font-size: 0.65rem; letter-spacing: 0.2em;
  text-transform: uppercase; cursor: pointer;
}
.scroll-line {
  width: 1px; height: 48px; background: rgba(255,255,255,0.3);
  position: relative; overflow: hidden;
}
.scroll-line::after {
  content: ''; position: absolute; top: -100%; left: 0; width: 1px; height: 100%;
  background: var(--gold);
  animation: scrollLine 2s ease-in-out infinite;
}
@keyframes scrollLine { 0% { top: -100%; } 100% { top: 100%; } }
.hero-stats {
  position: absolute; right: 6vw; top: 52%; transform: translateY(-50%);
  z-index: 2; display: flex; flex-direction: column; gap: 2.5rem;
}
.stat-item { text-align: right; }
.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.5rem; font-weight: 300; color: var(--white); line-height: 1;
  display: block;
}
.stat-label {
  font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}

/* SECTION COMMON */
section { padding: 110px 6vw; }
.section-label {
  font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 1.2rem;
  display: flex; align-items: center; gap: 12px;
}
.section-label::before { content: ''; width: 24px; height: 1px; background: var(--gold); }
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 4vw, 3.6rem);
  font-weight: 300;
  line-height: 1.08;
  color: var(--black);
  margin-bottom: 1.8rem;
}
.section-title em { font-style: italic; color: var(--gold); }
.section-subtitle {
  font-size: 0.95rem; font-weight: 300; color: var(--gray-500);
  line-height: 1.9; max-width: 540px;
}

/* SEARCH */
.search-section {
  background: var(--gray-50);
  padding: 56px 6vw;
  border-top: 1px solid var(--gray-200);
  border-bottom: 1px solid var(--gray-200);
}
.search-inner { max-width: 1200px; margin: 0 auto; }
.search-tabs {
  display: flex; gap: 0; margin-bottom: 2rem; border-bottom: 1px solid var(--gray-200);
}
.search-tab {
  padding: 12px 28px;
  font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
  background: none; border: none; cursor: pointer;
  color: var(--gray-400); border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all 0.3s; font-family: 'DM Sans', sans-serif;
}
.search-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.search-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px; align-items: end;
}
.search-field { display: flex; flex-direction: column; gap: 6px; }
.search-field label {
  font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gray-400); font-weight: 400;
}
.search-field select, .search-field input {
  height: 48px; padding: 0 14px;
  border: 1px solid var(--gray-200);
  background: var(--white); color: var(--black);
  font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
  border-radius: 2px; outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  -webkit-appearance: none; appearance: none;
  cursor: pointer;
}
.search-field select:focus, .search-field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,147,90,0.12);
}
.search-btn {
  height: 48px; padding: 0 32px;
  background: var(--black); color: var(--white);
  border: none; border-radius: 2px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 0.78rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  transition: all 0.3s; white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}
.search-btn:hover { background: var(--gold); transform: translateY(-1px); }

/* PROPERTIES */
.properties-section { background: var(--white); }
.section-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 4.5rem; flex-wrap: wrap; gap: 1.5rem;
}
.view-all {
  font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gold); text-decoration: none;
  display: flex; align-items: center; gap: 8px;
  transition: gap 0.3s;
}
.view-all:hover { gap: 14px; }
.view-all::after { content: '→'; }
.properties-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 3px;
}
.property-card {
  position: relative; overflow: hidden; cursor: pointer;
  background: var(--gray-900);
}
.property-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
  z-index: 1; transition: opacity 0.4s;
}
.prop-img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  transition: transform 0.7s var(--transition);
}
.property-card:hover .prop-img { transform: scale(1.05); }
.prop-badge {
  position: absolute; top: 20px; left: 20px; z-index: 2;
  padding: 5px 14px;
  background: var(--gold);
  color: var(--white);
  font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
  border-radius: 1px;
}
.prop-fav {
  position: absolute; top: 16px; right: 16px; z-index: 2;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
  border: none; border-radius: 50%; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s; color: var(--white);
  font-size: 1rem;
}
.prop-fav:hover, .prop-fav.active { background: var(--gold); }
.prop-info {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
  padding: 28px 28px 24px;
}
.prop-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem; font-weight: 400; color: var(--white);
  margin-bottom: 4px;
}
.prop-price span { font-size: 0.9rem; font-weight: 300; opacity: 0.7; }
.prop-title { font-size: 0.95rem; font-weight: 400; color: rgba(255,255,255,0.9); margin-bottom: 14px; }
.prop-meta {
  display: flex; gap: 18px; align-items: center; padding-top: 2px;
}
.prop-meta-item {
  font-size: 0.75rem; color: rgba(255,255,255,0.6);
  display: flex; align-items: center; gap: 5px;
}
.prop-actions {
  position: absolute; bottom: -60px; left: 0; right: 0; z-index: 3;
  padding: 0 24px;
  transition: bottom 0.4s var(--transition);
}
.property-card:hover .prop-actions { bottom: 24px; }
.property-card:hover .prop-info { bottom: 60px; transition: bottom 0.4s var(--transition); }
.prop-btn {
  width: 100%; padding: 12px;
  background: var(--gold); color: var(--white);
  border: none; border-radius: 2px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  transition: background 0.3s;
}
.prop-btn:hover { background: var(--gold-dark); }

/* DIVIDER */
.gold-divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  margin: 0 6vw;
  opacity: 0.6;
}

/* ABOUT */
.about-section {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8vw; align-items: center;
}
.about-visual {
  position: relative; aspect-ratio: 4/5;
}
.about-main-img {
  width: 100%; height: 100%;
  background: linear-gradient(145deg, #2D2920, #1E1B14);
  border-radius: 2px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

.about-features {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 2.5rem 3rem; margin-top: 3.5rem;
}
.about-feat { }
.about-feat-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem; font-weight: 500; margin-bottom: 8px; color: var(--black);
}
.about-feat-text { font-size: 0.85rem; color: var(--gray-500); line-height: 1.7; font-weight: 300; }
.about-feat-icon { font-size: 1.3rem; margin-bottom: 12px; color: var(--gold); display: block; }

/* TEAM */
.team-section { background: var(--gray-50); }
.team-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 2px; margin-top: 4.5rem;
}
.team-card {
  background: var(--white); overflow: hidden; position: relative;
  transition: transform 0.4s var(--transition), box-shadow 0.4s;
}
.team-card:hover { transform: translateY(-4px); box-shadow: 0 24px 60px rgba(0,0,0,0.1); z-index: 1; }
.team-photo {
  aspect-ratio: 3/4; width: 100%; overflow: hidden;
  background: linear-gradient(145deg, #2D2920, #1E1B14);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.team-photo-inner {
  width: 60%; aspect-ratio: 1; border-radius: 50%;
  background: linear-gradient(145deg, #3C3428, #2D2920);
  display: flex; align-items: center; justify-content: center;
  border: 2px solid rgba(184,147,90,0.3);
}
.team-photo-inner span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3rem; font-weight: 300; color: var(--gold);
}
.team-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.4s;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 20px; gap: 14px;
}
.team-card:hover .team-overlay { opacity: 1; }
.team-social {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.1);
  backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
  color: var(--white); font-size: 0.8rem; cursor: pointer;
  transition: all 0.3s; text-decoration: none;
}
.team-social:hover { background: var(--gold); border-color: var(--gold); }
.team-info { padding: 24px 28px 28px; }
.team-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.35rem; font-weight: 400; color: var(--black); margin-bottom: 6px;
}
.team-role { font-size: 0.75rem; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 12px; }
.team-whatsapp {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; color: var(--gray-500); text-decoration: none;
  transition: color 0.3s;
}
.team-whatsapp:hover { color: #25D366; }

/* TESTIMONIALS */
.testimonials-section { background: var(--black); position: relative; overflow: hidden; }
.testimonials-section::before {
  content: '"'; position: absolute;
  font-family: 'Cormorant Garamond', serif; font-size: 30rem; font-weight: 300;
  color: rgba(184,147,90,0.04); line-height: 1;
  top: -4rem; left: 2vw; pointer-events: none;
}
.testimonials-section .section-title { color: var(--white); }
.testimonials-section .section-label { }
.testimonials-section .section-subtitle { color: rgba(255,255,255,0.5); }
.testimonials-track {
  display: flex; gap: 24px; overflow: hidden;
  margin-top: 4.5rem; position: relative;
}
.testimonial-item {
  flex: 0 0 calc(50% - 12px); background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 2px;
  padding: 44px 48px; transition: all 0.4s;
}
.testimonial-item:hover { background: rgba(184,147,90,0.06); border-color: rgba(184,147,90,0.2); }
.stars { color: var(--gold); font-size: 0.85rem; margin-bottom: 1.5rem; letter-spacing: 3px; }
.testimonial-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem; font-weight: 300; font-style: italic;
  color: rgba(255,255,255,0.85); line-height: 1.6; margin-bottom: 2rem;
}
.testimonial-author { display: flex; align-items: center; gap: 14px; }
.author-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--white);
  font-weight: 300; flex-shrink: 0;
}
.author-name { font-size: 0.9rem; color: var(--white); font-weight: 400; }
.author-detail { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 2px; }
.carousel-controls { display: flex; gap: 8px; margin-top: 2rem; }
.carousel-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2); background: none; cursor: pointer;
  color: rgba(255,255,255,0.6); font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.carousel-btn:hover { border-color: var(--gold); color: var(--gold); }

/* BLOG */
.blog-section { background: var(--white); }
.blog-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr;
  gap: 3px; margin-top: 4.5rem;
}
.blog-card {
  position: relative; overflow: hidden; cursor: pointer; background: var(--gray-100);
  transition: transform 0.4s;
}
.blog-card:hover { z-index: 1; }
.blog-img {
  aspect-ratio: 16/10; width: 100%;
  background: linear-gradient(145deg, #2D2920, #1E1B14);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.blog-card:first-child .blog-img { aspect-ratio: 16/9; }
.blog-img-inner {
  position: absolute; inset: 0;
  transition: transform 0.6s var(--transition);
}
.blog-card:hover .blog-img-inner { transform: scale(1.04); }
.blog-cat {
  display: inline-block; margin: 24px 24px 0;
  font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); padding: 5px 14px; border: 1px solid var(--gold);
  border-radius: 1px;
}
.blog-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem; font-weight: 400; color: var(--black);
  line-height: 1.35; padding: 14px 24px 24px;
}
.blog-card:first-child .blog-title { font-size: 1.8rem; }
.blog-meta {
  padding: 0 20px 20px;
  font-size: 0.75rem; color: var(--gray-400);
  display: flex; align-items: center; gap: 12px;
}
.blog-meta::before { content: '—'; color: var(--gold-light); }

/* CONTACT */
.contact-section { background: var(--gray-50); }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8vw; margin-top: 5rem; }
.contact-form { display: flex; flex-direction: column; gap: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-row .form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label {
  font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gray-400);
}
.form-group input, .form-group textarea, .form-group select {
  padding: 15px 18px;
  border: 1px solid var(--gray-200);
  background: var(--white); color: var(--black);
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  border-radius: 2px; outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,147,90,0.1);
}
.form-group textarea { min-height: 140px; resize: vertical; }
.contact-info { display: flex; flex-direction: column; gap: 2.5rem; }
.contact-info-item { display: flex; gap: 24px; align-items: flex-start; }
.contact-icon {
  width: 48px; height: 48px; background: var(--gold-pale);
  border: 1px solid rgba(184,147,90,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: var(--gold); flex-shrink: 0; border-radius: 2px;
}
.contact-info-title { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 4px; }
.contact-info-val { font-size: 0.95rem; color: var(--black); line-height: 1.6; }
.map-placeholder {
  width: 100%; height: 240px; background: linear-gradient(145deg, #E8E6DC, #D8D5C8);
  border-radius: 2px; margin-top: 2rem;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gray-200); color: var(--gray-400); font-size: 0.85rem;
  letter-spacing: 0.1em; text-transform: uppercase; flex-direction: column; gap: 8px;
}

/* FOOTER */
footer { background: var(--gray-900); padding: 90px 6vw 40px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; gap: 5rem; margin-bottom: 5rem; }
.footer-logo {
  font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300;
  letter-spacing: 0.3em; color: var(--white); margin-bottom: 1.2rem; display: block;
}
.footer-tagline { font-size: 0.85rem; color: rgba(255,255,255,0.35); font-weight: 300; line-height: 1.7; margin-bottom: 2rem; }
.footer-socials { display: flex; gap: 12px; }
.footer-social {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5); font-size: 0.85rem; text-decoration: none;
  transition: all 0.3s;
}
.footer-social:hover { border-color: var(--gold); color: var(--gold); background: rgba(184,147,90,0.1); }
.footer-col-title {
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,255,255,0.35); margin-bottom: 1.5rem;
}
.footer-links { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.footer-links a {
  font-size: 0.9rem; color: rgba(255,255,255,0.55); text-decoration: none;
  transition: color 0.3s; font-weight: 300;
}
.footer-links a:hover { color: var(--gold); }
.newsletter-form { display: flex; flex-direction: column; gap: 10px; }
.newsletter-input {
  padding: 12px 16px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 2px;
  color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
  outline: none; transition: border-color 0.3s;
}
.newsletter-input:focus { border-color: var(--gold); }
.newsletter-input::placeholder { color: rgba(255,255,255,0.25); }
.newsletter-btn {
  padding: 12px 20px; background: var(--gold); color: var(--white);
  border: none; border-radius: 2px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem; letter-spacing: 0.15em;
  text-transform: uppercase; transition: background 0.3s;
}
.newsletter-btn:hover { background: var(--gold-dark); }
.footer-bottom {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 2rem;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
}
.footer-copy { font-size: 0.78rem; color: rgba(255,255,255,0.25); }
.footer-bottom-links { display: flex; gap: 2rem; }
.footer-bottom-links a { font-size: 0.75rem; color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.3s; }
.footer-bottom-links a:hover { color: var(--gold); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white); max-width: 900px; width: 100%;
  max-height: 90vh; overflow-y: auto; border-radius: 2px;
  animation: modalIn 0.4s var(--transition);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-header {
  padding: 36px 44px 0;
  display: flex; justify-content: space-between; align-items: flex-start;
}
.modal-close {
  background: none; border: none; cursor: pointer; font-size: 1.5rem;
  color: var(--gray-400); transition: color 0.3s; line-height: 1;
}
.modal-close:hover { color: var(--black); }
.modal-gallery {
  display: grid; grid-template-columns: 2fr 1fr;
  gap: 2px; margin: 20px 0;
}
.modal-main-img { aspect-ratio: 16/10; background: linear-gradient(145deg, #2D2920, #1E1B14); }
.modal-side-imgs { display: flex; flex-direction: column; gap: 2px; }
.modal-side-img { flex: 1; background: linear-gradient(145deg, #1E1B14, #2D2920); }
.modal-body { padding: 0 44px 44px; }
.modal-price {
  font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300;
  color: var(--gold); margin: 20px 0 4px;
}
.modal-address { color: var(--gray-500); font-size: 0.9rem; margin-bottom: 24px; }
.modal-specs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px;
  padding: 24px; background: var(--gray-50); border-radius: 2px;
}
.spec-item { text-align: center; }
.spec-num { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: var(--black); }
.spec-label { font-size: 0.7rem; color: var(--gray-400); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
.modal-desc { font-size: 0.9rem; color: var(--gray-500); line-height: 1.8; font-weight: 300; margin-bottom: 28px; }
.modal-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-gold { padding: 14px 28px; background: var(--gold); color: var(--white); border: none; border-radius: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
.btn-gold:hover { background: var(--gold-dark); }
.btn-dark { padding: 14px 28px; background: var(--black); color: var(--white); border: none; border-radius: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; transition: all 0.3s; }
.btn-dark:hover { background: var(--gray-700); }

/* WHATSAPP FLOAT */
.wa-float {
  position: fixed; bottom: 32px; right: 32px; z-index: 999;
  width: 56px; height: 56px; border-radius: 50%;
  background: #25D366; color: var(--white); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
  box-shadow: 0 8px 24px rgba(37,211,102,0.4);
  transition: all 0.3s; text-decoration: none;
}
.wa-float:hover { transform: scale(1.1); box-shadow: 0 12px 32px rgba(37,211,102,0.5); }
.wa-float::before {
  content: 'Falar connosco';
  position: absolute; right: 66px; top: 50%; transform: translateY(-50%);
  background: var(--gray-900); color: var(--white);
  font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 300;
  padding: 8px 14px; border-radius: 2px; white-space: nowrap;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.wa-float:hover::before { opacity: 1; }

/* NOTIFICATION */
.notification {
  position: fixed; top: 90px; right: 24px; z-index: 1500;
  background: var(--white); border: 1px solid var(--gray-200);
  padding: 14px 20px; border-radius: 2px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  font-size: 0.85rem; color: var(--black);
  display: flex; align-items: center; gap: 10px;
  transform: translateX(120%); transition: transform 0.4s var(--transition);
  border-left: 3px solid var(--gold);
}
.notification.show { transform: translateX(0); }
.notif-icon { color: var(--gold); font-size: 1rem; }

/* ANIMATIONS */
.reveal {
  opacity: 0; transform: translateY(32px);
  transition: opacity 0.8s var(--transition), transform 0.8s var(--transition);
}
.reveal.visible { opacity: 1; transform: none; }
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }

/* LOGIN MODAL */
.login-modal {
  background: var(--white); max-width: 440px; width: 100%;
  border-radius: 2px; padding: 48px;
  animation: modalIn 0.4s var(--transition);
}
.login-logo {
  font-family: 'Cormorant Garamond', serif; font-size: 2.2rem;
  font-weight: 300; letter-spacing: 0.3em; color: var(--black);
  text-align: center; margin-bottom: 8px;
}
.login-subtitle { text-align: center; color: var(--gray-400); font-size: 0.85rem; margin-bottom: 2rem; }
.login-tabs { display: flex; border-bottom: 1px solid var(--gray-200); margin-bottom: 1.5rem; }
.login-tab { flex: 1; padding: 10px; text-align: center; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; letter-spacing: 0.1em; color: var(--gray-400); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.3s; }
.login-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.admin-note { background: var(--gold-pale); border: 1px solid rgba(184,147,90,0.2); padding: 12px 16px; border-radius: 2px; font-size: 0.78rem; color: var(--gray-500); margin-bottom: 1.5rem; }

/* RESPONSIVE */
/* ── TABLET ── */
@media (max-width: 1024px) {
  .hero-stats { display: none; }
  .blog-grid { grid-template-columns: 1fr 1fr; }
  .blog-card:first-child { grid-column: span 2; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 2.5rem; }
  .properties-grid { grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); }
  .team-grid { grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); }
}

/* ── MOBILE LANDSCAPE / SMALL TABLET ── */
@media (max-width: 768px) {
  :root { --nav-h: 64px; }

  /* NAV */
  .nav-links { display: none; }
  .hamburger { display: flex; }
  nav { padding: 0 4vw; }
  nav.scrolled .hamburger span { background: var(--black); }

  /* HERO */
  .hero { min-height: 100svh; align-items: flex-end; }
  .hero-visual { grid-template-columns: 1fr; }
  .hero-img-block:last-child { display: none; }
  .hero-title { font-size: clamp(2.4rem, 9vw, 4rem); }
  .hero-subtitle { font-size: 0.9rem; max-width: 100%; }
  .hero-content { padding: 0 4vw 10vh; }
  .hero-eyebrow { font-size: 0.65rem; }
  .hero-scroll { display: none; }

  /* SECTIONS */
  section { padding: 60px 4vw; }
  .section-title { font-size: clamp(1.8rem, 6vw, 2.8rem); }
  .section-header { flex-direction: column; align-items: flex-start; gap: 1rem; margin-bottom: 2.5rem; }

  /* SEARCH */
  .search-section { padding: 40px 4vw; }
  .search-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 0; }
  .search-tab { flex-shrink: 0; padding: 10px 20px; }
  .search-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .search-field:last-child { grid-column: span 2; }
  .search-btn { width: 100%; justify-content: center; }

  /* PROPERTIES */
  .properties-grid { grid-template-columns: 1fr; gap: 2px; }
  .prop-actions { bottom: 0 !important; position: relative; }
  .property-card .prop-info { bottom: 0 !important; position: relative; background: var(--gray-900); padding: 16px; }
  .property-card::after { display: none; }
  .property-card { background: var(--gray-100); }
  .prop-price { color: var(--black); }
